<!DOCTYPE html>
<html lang="{{ lang }}">
    <head>
        <meta charset="utf-8">
        <title>{% block title %}ssg.evanchen.cc{% endblock %}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap"
              rel="stylesheet">
        <link rel="stylesheet" href="/tlayout.css" />
    </head>
    <body>
        <div id="wrapper">
            <header id="layout-header">
                <h1>
                    <a href="/">ssg.evanchen.cc</a>
                    — An SSG Tutorial
                </h1>
            </header>
            <aside id="layout-nav">
                <h2>Navigation</h2>
                {% set root = get_section(path="_index.md") %}
                {% for page in root.pages %}
                    <p><a href="{{ page.permalink }}">{{ page.title }}</a></p>
                {% endfor %}
            </aside>
            <article id="layout-content">
                {% block content %}
                {% endblock content %}
            </article>
        </div>
    </body>
</html>
